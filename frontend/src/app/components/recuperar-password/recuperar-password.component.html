<div class="center-wrapper">
  <p-toast></p-toast>

  <!-- Estado de carga inicial -->
  <div class="loading-container" *ngIf="!componeteReady">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p>Cargando...</p>
    </div>
  </div>
  <div class="recovery-container" *ngIf="componeteReady">
    <!-- Logo/Icon -->
    <div class="logo-section">
      <i class="pi pi-key logo-icon"></i>
      <h1 class="titulo">
        {{ step === 1 ? "Recuperar Contraseña" : "Restablecer Contraseña" }}
      </h1>
      <p class="subtitle">
        {{
          step === 1
            ? "Ingresa tu email para recibir un código de recuperación"
            : "Ingresa el código y tu nueva contraseña"
        }}
      </p>
    </div>

    <!-- Paso 1: Solicitar código -->
    <form *ngIf="step === 1" class="recovery-form">
      <div class="form-field">
        <p-iftalabel>
          <input
            style="width: 100%"
            type="email"
            id="email"
            name="email"
            pInputText
            [(ngModel)]="form.email"
            placeholder=" "
            [disabled]="loading"
            autocomplete="email"
            class="styled-input"
          />
          <label for="email">
            <i class="pi pi-envelope field-icon"></i>
            Email
          </label>
        </p-iftalabel>
      </div>
      <div class="button-section">
        <button
          type="button"
          class="secondary-button"
          (click)="volver()"
          [disabled]="loading"
        >
          <i class="pi pi-arrow-left"></i>
          {{ loading ? "Espere..." : "Volver" }}
        </button>
        <button
          type="button"
          class="primary-button"
          [class.loading]="loading"
          (click)="solicitarCodigo()"
          [disabled]="loading"
        >
          <span class="button-text">
            <i class="pi pi-send"></i>
            {{ loading ? "Enviando..." : "Enviar Código" }}
          </span>
          <div class="loading-spinner" *ngIf="loading"></div>
        </button>
      </div>
    </form>

    <!-- Paso 2: Restablecer contraseña -->
    <form *ngIf="step === 2" class="recovery-form">
      <div class="form-field">
        <p-iftalabel>
          <input
            style="width: 100%"
            type="text"
            id="codigo"
            name="codigo"
            pInputText
            [(ngModel)]="form.codigo"
            placeholder=" "
            maxlength="6"
            [disabled]="loading"
            autocomplete="one-time-code"
            class="styled-input"
          />
          <label for="codigo">
            <i class="pi pi-shield field-icon"></i>
            Código de Recuperación
          </label>
        </p-iftalabel>
      </div>
      <div class="form-field">
        <p-iftalabel>
          <p-password
            [(ngModel)]="form.nuevaPassword"
            name="nuevaPassword"
            inputId="nuevaPassword"
            placeholder=" "
            [feedback]="false"
            [toggleMask]="true"
            [disabled]="loading"
            autocomplete="new-password"
            styleClass="styled-password w-full"
            styleClass="styled-password w-full"
            [inputStyle]="{ width: '100%' }"
            [style]="{ width: '100%' }"
          />
          <label for="nuevaPassword">
            <i class="pi pi-lock field-icon"></i>
            Nueva Contraseña
          </label>
        </p-iftalabel>
      </div>
      <div class="form-field">
        <p-iftalabel>
          <p-password
            [(ngModel)]="form.confirmarPassword"
            name="confirmarPassword"
            inputId="confirmarPassword"
            placeholder=" "
            [feedback]="false"
            [toggleMask]="true"
            [disabled]="loading"
            autocomplete="new-password"
            styleClass="styled-password w-full"
            styleClass="styled-password w-full"
            [inputStyle]="{ width: '100%' }"
            [style]="{ width: '100%' }"
          />
          <label for="confirmarPassword">
            <i class="pi pi-lock field-icon"></i>
            Confirmar Nueva Contraseña
          </label>
        </p-iftalabel>
      </div>
      <div class="button-section">
        <button
          type="button"
          class="secondary-button"
          (click)="volverAlPaso1()"
          [disabled]="loading"
        >
          <i class="pi pi-arrow-left"></i>
          {{ loading ? "Espere..." : "Volver" }}
        </button>
        <button
          type="button"
          class="primary-button"
          [class.loading]="loading"
          (click)="restablecerPassword()"
          [disabled]="loading"
        >
          <span class="button-text">
            <i class="pi pi-check"></i>
            {{ loading ? "Cambiando..." : "Cambiar Contraseña" }}
          </span>
          <div class="loading-spinner" *ngIf="loading"></div>
        </button>
      </div>
    </form>
    <div class="login-link-section">
      ¿Recordaste tu contraseña?
      <a (click)="volver()">Iniciar Sesión</a>
    </div>
  </div>
</div>
