<app-header></app-header>
<main *ngIf="cliente">
  <article class="flex" >
    <div class="w-full Tarjetas">
      <div class="tarjeta-1">
        <h1 class="titulo">{{ cliente.nombre }}</h1>
        <p>Telefono: {{ cliente.telefono }}</p>
      </div>

      <div class="miniCartel">
        <div class="w-full cabezaMiniCartel">
          <span class="textoMiniCartel">Deuda Actual</span>
          <span class="pi pi-dollar logoMiniCartel"></span>
        </div>

        <div class="flex flex-column w-full papaNumeros">
          <span class="w-full numero1MiniCartel">$ {{ cliente.credito.precioTotal }}</span>
          <p class="texito">Pago hasta ahora: {{ cliente.credito.pagoHastaAhora }}</p>

          <div class="papaBoton w-full">
            <p-button class="boton" label="Pagar" severity="secondary" (click)="showDialog()"></p-button>
            <p-dialog header="Pagar" [(visible)]="visible" [modal]="true" [breakpoints]="{ '400px': '80vw' }" [draggable]="false" [resizable]="true">
              <div class="flex">
                <p-inputgroup class="w-full ">
                  <input pInputText class="border-right" placeholder="Cantidad" style="font-size: 1.2rem;" [(ngModel)]="pago" type="number"/>
                  <p-inputgroup-addon>

                    <p-button label="Confirmar" severity="secondary" variant="text"  (click)="pagoButton()"/>

                  </p-inputgroup-addon>
                </p-inputgroup>
              </div>
            </p-dialog>
          </div>

        </div>


      </div>
    </div>

    <img class="imagen">


  </article>

  <article class="w-full cartelEditar">
    <p-button label="Editar Cliente" severity="secondary" (click)="showDialogEditar()"></p-button>
      <p-dialog header="Editar Cliente" [(visible)]="visibleEditar" [modal]="true" [breakpoints]="{ '400px': '80vw' }" [draggable]="false" [resizable]="true">
              <div class="flex flex-column w-full gap-3">
                <div class="w-full">
                  <label for="nombre" class="block mb-2">Nombre</label>
                  <input id="nombre" pInputText class="w-full" placeholder="Nombre" style="font-size: 1.2rem;" [(ngModel)]="nombreEdicion"/>
                </div>
                
                <div class="w-full">
                  <label for="telefono" class="block mb-2">Teléfono</label>
                  <input id="telefono" pInputText class="w-full" placeholder="Telefono" style="font-size: 1.2rem;" [(ngModel)]="telefonoEdicion"/>
                </div>
                
                <div class="w-full flex justify-content-end mt-3">
                  <p-button label="Confirmar" severity="secondary" (click)="editarCliente()"></p-button>
                </div>
              </div>
      </p-dialog>
  </article>

  <article class="w-full tablaMargen">
    <h1 class="tituloTabla">Compras</h1>
    <p-table
      class="texto"
      [value]="cliente.credito.ventas || []"
      [paginator]="true"
      [rows]="5"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} compras"
      showGridlines
      [responsive]="true">

      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Fecha</th>
          <th>Total</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-venta>
        <tr>
          <td>{{ venta.id }}</td>
          <td>{{ venta.fechaVenta | date:'dd/MM/yyyy' }}</td>
          <td>{{ venta.total }}</td>
        </tr>
      </ng-template>
    </p-table>
  </article>

</main>
<app-footer></app-footer>
