<app-header></app-header>
<main class="w-full">
  <h1 class="w-full textoNegro">Proveedores</h1>
  <article class="w-full flex padreBotonInput">
    <p-inputgroup>
      <input pInputText placeholder="Buscar por nombre" [(ngModel)]="busqueda"/>
        <p-inputgroup-addon>

        <p-button icon="pi pi-search" severity="secondary" variant="text" (click)="buscarProveedor()"/>

      </p-inputgroup-addon>
    </p-inputgroup>

    <p-button label="Añadir Nuevo" class="boton" severity="secondary" (click)="mostarModal()"></p-button>    <p-dialog 
      header="Añadir nuevo proveedor" 
      [(visible)]="visible" 
      [modal]="true" 
      [style]="{width: '400px'}"
      [draggable]="false"
      [resizable]="false">
      
      <div class="flex flex-column gap-3">
        <div class="field">
          <label for="nombre" class="block mb-2">Nombre</label>
          <input 
            id="nombre" 
            pInputText 
            [(ngModel)]="nombre" 
            class="w-full"
            placeholder="Ingrese el nombre del proveedor"
            autocomplete="off" />
        </div>
        
        <div class="field">
          <label for="telefono" class="block mb-2">Teléfono</label>
          <input 
            id="telefono" 
            pInputText 
            [(ngModel)]="telefono" 
            class="w-full"
            placeholder="Ingrese el teléfono"
            autocomplete="off" />
        </div>
        
        <div class="field">
          <label for="correo" class="block mb-2">Correo Electrónico</label>
          <input 
            id="correo" 
            pInputText 
            [(ngModel)]="correo" 
            class="w-full"
            placeholder="Ingrese el correo electrónico"
            type="email" 
            autocomplete="off" />
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
          <p-button 
            label="Cancelar" 
            icon="pi pi-times" 
            (click)="cerrarDialog()"
            styleClass="p-button-text">
          </p-button>
          <p-button 
            label="Guardar" 
            icon="pi pi-check" 
            (click)="saveProveedor()"
            severity="secondary">
          </p-button>
        </div>
      </ng-template>
    </p-dialog>

  </article>  <article class="w-full">
    <p-table
      class="texto"
      [value]="proveedoresFiltrados && proveedoresFiltrados.length > 0 ? proveedoresFiltrados : proveedores || []"
      [paginator]="true"
      [rows]="5"      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} proveedores"
      showGridlines
      [responsive]="true">      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>Correo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>      <ng-template pTemplate="body" let-proveedor>
        <tr>
          <td>{{ proveedor.id }}</td>
          <td>{{ proveedor.nombre }}</td>
          <td>{{ proveedor.telefono }}</td>
          <td>{{ proveedor.correo }}</td>
          <td>
            <p-button 
              icon="pi pi-eye" 
              severity="info" 
              size="small" 
              [text]="true"
              (click)="mostrarDetalles(proveedor.id)"
              pTooltip="Ver proveedor"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text mr-2">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              severity="danger" 
              size="small"
              [text]="true"
              (click)="eliminarProveedor(proveedor.id)" 
              pTooltip="Eliminar proveedor"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </article>

</main>
<app-footer></app-footer>
