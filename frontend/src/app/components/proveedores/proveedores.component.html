<app-header></app-header>
<main class="w-full">
  <h1 class="w-full textoNegro">Proveedores</h1>
  <article class="w-full flex padreBotonInput">
    <p-inputgroup>
      <input pInputText placeholder="Buscar por nombre" [(ngModel)]="busqueda"/>
        <p-inputgroup-addon>

        <p-button icon="pi pi-search" severity="secondary" variant="text" (click)="buscarProveedor()"/>

      </p-inputgroup-addon>
    </p-inputgroup>

    <p-button label="Añadir Nuevo" class="boton" severity="secondary" (click)="mostarModal()"></p-button>
    <p-dialog header="Añadir nuevo proveedor" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
      <div class="flex items-center gap-4 mb-4">
        <label for="username" class="font-semibold w-24 modal">Nombre</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="nombre" autocomplete="off" />
      </div>
      <div class="flex items-center gap-4 mb-4">
        <label for="telefono" class="font-semibold w-24 modal">Telefono</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="telefono" autocomplete="off" />
      </div>      <div class="flex items-center gap-4 mb-4">
        <label for="correo" class="font-semibold w-24 modal">Correo</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="correo" autocomplete="off" type="email" />
      </div>

      <div class="flex justify-end gap-2">
        <p-button label="Confirmar" severity="secondary" (click)="saveProveedor()" />
      </div>
    </p-dialog>

  </article>  <article class="w-full">
    <p-table
      class="texto"
      [value]="proveedoresFiltrados && proveedoresFiltrados.length > 0 ? proveedoresFiltrados : proveedores || []"
      [paginator]="true"
      [rows]="5"      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} proveedores"
      showGridlines
      [responsive]="true">      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>Correo</th>
          <th>.</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-proveedor>
        <tr>
          <td>{{ proveedor.id }}</td>
          <td><a href="javascript:void(0)" (click)="mostrarDetalles(proveedor.id)" class="hover:underline text-blue-600">{{ proveedor.nombre }}</a></td>
          <td>{{ proveedor.telefono }}</td>
          <td>{{ proveedor.correo }}</td>
          <td>
            <p-button icon="pi pi-trash" severity="danger" (click)="eliminarProveedor(proveedor.id)" styleClass="p-button-rounded p-button-text"></p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </article>

</main>
<app-footer></app-footer>
