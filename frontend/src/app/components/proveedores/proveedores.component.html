<app-header></app-header>
<main class="w-full">
  <h1 class="w-full textoNegro">Proveedores</h1>
  
  <article class="search-and-actions">
    <div class="search-section">
      <p-inputgroup class="search-input">
        <input pInputText placeholder="Buscar por nombre" [(ngModel)]="busqueda"/>
        <p-inputgroup-addon>
          <p-button icon="pi pi-search" severity="secondary" variant="text" (click)="buscarProveedor()"/>
        </p-inputgroup-addon>
      </p-inputgroup>
    </div>    <div class="actions-section">
      <p-button 
        label="Añadir Nuevo" 
        icon="pi pi-plus"
        styleClass="custom-add-button"
        (click)="mostarModal()">
      </p-button>
    </div>
  </article>  <!-- Modal de añadir proveedor -->  <p-dialog 
    header="Añadir Nuevo Proveedor" 
    [(visible)]="visible" 
    [modal]="true" 
    [style]="{width: '450px'}"
    [contentStyle]="{overflow: 'auto'}"
    [draggable]="false"
    [resizable]="false"
    [closable]="true"
    styleClass="lote-dialog"
    appendTo="body">
    <form class="form-content">
      <div class="form-group">
        <label for="nombre">Nombre del Proveedor *</label>
        <input 
          id="nombre" 
          pInputText 
          [(ngModel)]="nombre" 
          name="nombre"
          class="w-full"
          placeholder="Ingrese el nombre del proveedor"
          autocomplete="off" />
      </div>
        
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input 
            id="telefono" 
            pInputText 
            [(ngModel)]="telefono" 
            name="telefono"
            class="w-full"
            placeholder="Ej: +569 1234 5678"
            autocomplete="off" />
        </div>
        
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input 
            id="correo" 
            pInputText 
            [(ngModel)]="correo" 
            name="correo"
            class="w-full"
            placeholder="ejemplo@correo.com"
            type="email" 
            autocomplete="off" />
        </div>
      </form>

      <ng-template pTemplate="footer">
        <button 
          pButton 
          type="button" 
          label="Cancelar" 
          class="p-button-text"
          (click)="cerrarDialog()">
        </button>
        <button 
          pButton 
          type="button" 
          label="Guardar Proveedor" 
          class="p-button-success"
          (click)="saveProveedor()">
        </button>
      </ng-template>  </p-dialog>

  <article class="w-full">
    <p-table
      class="texto"
      [value]="proveedoresFiltrados && proveedoresFiltrados.length > 0 ? proveedoresFiltrados : proveedores || []"
      [paginator]="true"
      [rows]="5"      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} proveedores"
      showGridlines
      [responsive]="true">      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>Correo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>      <ng-template pTemplate="body" let-proveedor>
        <tr>
          <td>{{ proveedor.id }}</td>
          <td>{{ proveedor.nombre }}</td>
          <td>{{ proveedor.telefono }}</td>
          <td>{{ proveedor.correo }}</td>
          <td>
            <p-button 
              icon="pi pi-eye" 
              severity="info" 
              size="small" 
              [text]="true"
              (click)="mostrarDetalles(proveedor.id)"
              pTooltip="Ver proveedor"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text mr-2">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              severity="danger" 
              size="small"
              [text]="true"
              (click)="eliminarProveedor(proveedor.id)" 
              pTooltip="Eliminar proveedor"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>  </article>

</main>
<p-toast></p-toast>
<app-footer></app-footer>
