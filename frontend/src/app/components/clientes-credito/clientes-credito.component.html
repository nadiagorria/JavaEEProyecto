<app-header></app-header>
<main class="w-full">
  <h1 class="w-full textoNegro">Clientes a Crédito</h1>
  <article class="w-full flex padreBotonInput">
    <p-inputgroup>
      <input pInputText placeholder="Buscar por nombre" [(ngModel)]="busqueda"/>
        <p-inputgroup-addon>

        <p-button icon="pi pi-search" severity="secondary" variant="text" (click)="buscarCliente()"/>

      </p-inputgroup-addon>
    </p-inputgroup>

    <p-button label="Añadir Nuevo" class="boton" severity="secondary" (click)="mostarModal()"></p-button>
    <p-dialog header="Añadir nuevo cliente a credito" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }">
      <div class="flex items-center gap-4 mb-4">
        <label for="username" class="font-semibold w-24 modal">Nombre</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="nombre" autocomplete="off" />
      </div>
      <div class="flex items-center gap-4 mb-4">
        <label for="telefono" class="font-semibold w-24 modal">Telefono</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="telefono" autocomplete="off" />
      </div>      <div class="flex items-center gap-4 mb-4">
        <label for="min" class="font-semibold w-24 modal">Min</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="minimo" autocomplete="off" type="number" />
      </div>
      <div class="flex items-center gap-4 mb-4">
        <label for="max" class="font-semibold w-24 modal">Max</label>
        <input pInputText class="flex-auto modal" [(ngModel)]="maximo" autocomplete="off" type="number"/>
      </div>
      <div class="flex justify-end gap-2">
        <p-button label="Confirmar" severity="secondary" (click)="saveCliente()" />
      </div>
    </p-dialog>

  </article>  <article class="w-full">
    <p-table
      class="texto"
      [value]="creditosFiltrados && creditosFiltrados.length > 0 ? creditosFiltrados : creditos || []"
      [paginator]="true"
      [rows]="5"      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} créditos"
      showGridlines
      [responsive]="true">      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>Crédito Minimo</th>
          <th>Crédito Maximo</th>
          <th>Deuda</th>
          <th>Pago hasta ahora</th>
          <th>Acciones</th>
        </tr>
      </ng-template>      <ng-template pTemplate="body" let-credito>
        <tr>
          <td>{{ credito.cliente.id }}</td>
          <td>{{ credito.cliente.nombre }}</td>
          <td>{{ credito.cliente.telefono }}</td>
          <td>{{ credito.minimo }}</td>
          <td>{{ credito.maximo }}</td>
          <td>{{ credito.precioTotal }}</td>
          <td>{{ credito.pagoHastaAhora }}</td>
          <td>
            <p-button 
              icon="pi pi-eye" 
              severity="info" 
              size="small" 
              [text]="true"
              (click)="mostrarDetalles(credito.cliente.id)"
              pTooltip="Ver cliente"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text mr-2">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              severity="danger" 
              size="small"
              [text]="true"
              (click)="eliminarCliente(credito.cliente.id)" 
              pTooltip="Eliminar cliente"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </article>

</main>
<app-footer></app-footer>
