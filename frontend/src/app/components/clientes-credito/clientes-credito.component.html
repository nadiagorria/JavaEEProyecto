<app-header></app-header>
<main class="w-full">
  <h1 class="w-full textoNegro">Clientes a Crédito</h1>
  <article class="w-full flex padreBotonInput">
    <p-inputgroup>
      <input pInputText placeholder="Buscar por nombre" [(ngModel)]="busqueda"/>
        <p-inputgroup-addon>

        <p-button icon="pi pi-search" severity="secondary" variant="text" (click)="buscarCliente()"/>

      </p-inputgroup-addon>
    </p-inputgroup>    <p-button label="Añadir Nuevo" class="boton" severity="secondary" (click)="mostarModal()"></p-button>
    <p-dialog 
      header="Añadir nuevo cliente a crédito" 
      [(visible)]="visible" 
      [modal]="true" 
      [style]="{width: '400px'}"
      [draggable]="false"
      [resizable]="false">
      
      <div class="flex flex-column gap-3">
        <div class="field">
          <label for="nombre" class="block mb-2">Nombre</label>
          <input 
            id="nombre" 
            pInputText 
            [(ngModel)]="nombre" 
            class="w-full"
            placeholder="Ingrese el nombre del cliente"
            autocomplete="off" />
        </div>
        
        <div class="field">
          <label for="telefono" class="block mb-2">Teléfono</label>
          <input 
            id="telefono" 
            pInputText 
            [(ngModel)]="telefono" 
            class="w-full"
            placeholder="Ingrese el teléfono"
            autocomplete="off" />
        </div>
        
        <div class="field">
          <label for="minimo" class="block mb-2">Crédito Mínimo</label>
          <input 
            id="minimo" 
            pInputText 
            [(ngModel)]="minimo" 
            class="w-full"
            placeholder="Ingrese el crédito mínimo"
            type="number" 
            autocomplete="off" />
        </div>
        
        <div class="field">
          <label for="maximo" class="block mb-2">Crédito Máximo</label>
          <input 
            id="maximo" 
            pInputText 
            [(ngModel)]="maximo" 
            class="w-full"
            placeholder="Ingrese el crédito máximo"
            type="number"
            autocomplete="off" />
        </div>
      </div>

      <ng-template pTemplate="footer">
        <div class="flex justify-content-end gap-2">
          <p-button 
            label="Cancelar" 
            icon="pi pi-times" 
            (click)="cerrarDialog()"
            styleClass="p-button-text">
          </p-button>
          <p-button 
            label="Guardar" 
            icon="pi pi-check" 
            (click)="saveCliente()"
            severity="secondary">
          </p-button>
        </div>
      </ng-template>
    </p-dialog>

  </article>  <article class="w-full">
    <p-table
      class="texto"
      [value]="creditosFiltrados && creditosFiltrados.length > 0 ? creditosFiltrados : creditos || []"
      [paginator]="true"
      [rows]="5"      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} créditos"
      showGridlines
      [responsive]="true">      <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>Crédito Minimo</th>
          <th>Crédito Maximo</th>
          <th>Deuda</th>
          <th>Pago hasta ahora</th>
          <th>Acciones</th>
        </tr>
      </ng-template>      <ng-template pTemplate="body" let-credito>
        <tr>
          <td>{{ credito.cliente.id }}</td>
          <td>{{ credito.cliente.nombre }}</td>
          <td>{{ credito.cliente.telefono }}</td>
          <td>{{ credito.minimo }}</td>
          <td>{{ credito.maximo }}</td>
          <td>{{ credito.precioTotal }}</td>
          <td>{{ credito.pagoHastaAhora }}</td>
          <td>
            <p-button 
              icon="pi pi-eye" 
              severity="info" 
              size="small" 
              [text]="true"
              (click)="mostrarDetalles(credito.cliente.id)"
              pTooltip="Ver cliente"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text mr-2">
            </p-button>
            <p-button 
              icon="pi pi-trash" 
              severity="danger" 
              size="small"
              [text]="true"
              (click)="eliminarCliente(credito.cliente.id)" 
              pTooltip="Eliminar cliente"
              tooltipPosition="top"
              styleClass="p-button-rounded p-button-text">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </article>

</main>
<app-footer></app-footer>
