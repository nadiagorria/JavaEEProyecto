<app-header></app-header>
<main class="w-full">
  <h1 class="w-full textoNegro">Clientes a Crédito</h1>
  <article class="search-and-actions">
    <div class="search-section">
      <p-inputgroup class="search-input">
        <input pInputText placeholder="Buscar por nombre" [(ngModel)]="busqueda" />
        <p-inputgroup-addon>
          <p-button icon="pi pi-search" severity="secondary" variant="text" (click)="buscarCliente()" />
        </p-inputgroup-addon>
      </p-inputgroup>
    </div>
    <div class="actions-section" *ngIf="isAdmin()"> <p-button label="Añadir Nuevo" icon="pi pi-plus"
        styleClass="custom-add-button" (click)="mostarModal()">
      </p-button>
    </div>
  </article>

  <!-- Modal de añadir cliente --> <p-dialog header="Añadir Nuevo Cliente" [(visible)]="visible" [modal]="true"
    [style]="{width: '450px'}" [contentStyle]="{overflow: 'auto'}" [draggable]="false" [resizable]="false"
    [closable]="true" styleClass="form-dialog" appendTo="body">
    <form class="form-content">
      <div class="form-group">
        <label for="nombre">Nombre del Cliente *</label>
        <input id="nombre" pInputText [(ngModel)]="nombre" name="nombre" class="w-full"
          placeholder="Ingrese el nombre del cliente" autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input id="telefono" pInputText [(ngModel)]="telefono" name="telefono" class="w-full"
          placeholder="Ej: +569 1234 5678" autocomplete="off" />
      </div>

      <div class="form-row">
        <div class="form-col">
          <div class="form-group">
            <label for="minimo">Crédito Mínimo *</label>
            <input id="minimo" pInputText [(ngModel)]="minimo" name="minimo" class="w-full" placeholder="0"
              type="number" min="0" step="0.01" autocomplete="off" />
          </div>
        </div>

        <div class="form-col">
          <div class="form-group">
            <label for="maximo">Crédito Máximo *</label>
            <input id="maximo" pInputText [(ngModel)]="maximo" name="maximo" class="w-full" placeholder="0"
              type="number" min="0" step="0.01" autocomplete="off" />
          </div>
        </div>
      </div>
    </form>

    <ng-template pTemplate="footer">
      <button pButton type="button" label="Cancelar" class="p-button-text" (click)="cerrarDialog()">
      </button>
      <button pButton type="button" label="Guardar Cliente" class="p-button-success" (click)="saveCliente()">
      </button>
    </ng-template>
  </p-dialog>
  <article class="w-full">
    <p-table class="texto"
      [value]="creditosFiltrados && creditosFiltrados.length > 0 ? creditosFiltrados : creditos || []"
      [paginator]="true" [rows]="5" [totalRecords]="totalRecords" [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} créditos"
      showGridlines [responsive]="true"> <ng-template pTemplate="header">
        <tr>
          <th>Id</th>
          <th>Nombre</th>
          <th>Telefono</th>
          <th>Crédito Minimo</th>
          <th>Crédito Maximo</th>
          <th>Deuda</th>
          <th>Pago hasta ahora</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-credito>
        <tr>
          <td>{{ credito.cliente.id }}</td>
          <td>{{ credito.cliente.nombre }}</td>
          <td>{{ credito.cliente.telefono }}</td>
          <td>$ {{ credito.minimo }}</td>
          <td>$ {{ credito.maximo }}</td>
          <td>$ {{ credito.precioTotal }}</td>
          <td>$ {{ credito.pagoHastaAhora }}</td>
          <td>
            <p-button icon="pi pi-eye" severity="info" size="small" [text]="true"
              (click)="mostrarDetalles(credito.cliente.id)" pTooltip="Ver cliente" tooltipPosition="top"
              styleClass="p-button-rounded p-button-text mr-2">
            </p-button>
            <p-button icon="pi pi-trash" severity="danger" size="small" [text]="true"
              (click)="eliminarCliente(credito.cliente.id)" pTooltip="Eliminar cliente" tooltipPosition="top"
              styleClass="p-button-rounded p-button-text" *ngIf="isAdmin()">
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </article>

</main>
<p-toast></p-toast>
<app-footer></app-footer>
