<app-header></app-header>

<div class="container mx-auto p-4">
  <div class="grid">
    <!-- Perfil Card -->
    <div class="col-12 md:col-4 lg:col-3">
      <p-card>
        <div class="flex flex-column align-items-center text-center">
          <p-avatar [image]="usuario.avatar" styleClass="mb-3" size="xlarge" shape="circle" />
          <h2 class="text-xl font-semibold mb-2">{{usuario.nombreUsuario}}</h2>
          <div class="mb-3">
            <p-tag *ngFor="let role of usuario.roles" 
                   [value]="role" 
                   [severity]="getRoleSeverity(role)"
                   class="mr-2">
            </p-tag>
          </div>
          <p class="text-gray-600 mb-4">{{usuario.email}}</p>
          <div class="flex gap-2">
            <p-button icon="pi pi-user-edit" 
                     (click)="editarCuenta()" 
                     label="Editar" 
                     [outlined]="true">
            </p-button>
            <p-button icon="pi pi-sign-out" 
                     (click)="cerrarSesion()" 
                     severity="danger" 
                     label="Salir" 
                     [outlined]="true">
            </p-button>
          </div>
        </div>
      </p-card>
    </div>

    <!-- Ventas Table -->
    <div class="col-12 md:col-8 lg:col-9">
      <p-card header="Mis Ventas">
        <p-table [value]="ventas" 
                 [paginator]="true" 
                 [rows]="10" 
                 [totalRecords]="totalVentas"
                 currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} ventas"
                 [showCurrentPageReport]="true"
                 [tableStyle]="{ 'min-width': '50rem' }">
          <ng-template pTemplate="header">
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Total</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-venta>
            <tr>
              <td>{{venta.id}}</td>
              <td>{{venta.cliente}}</td>
              <td>{{venta.fecha}}</td>
              <td>{{venta.total}}</td>
            </tr>
          </ng-template>
        </p-table>
      </p-card>
    </div>
  </div>
</div>

<app-footer></app-footer>
