<app-header></app-header>

<div class="grid">
  <div class="col-12">
    
    <div class="col-12 mb-3 pl-5">
      <h2 class="texto">Gestión de Ventas</h2>
    </div>

    <div class="col-12 flex justify-content-center">
      <div class="md:col-8 lg:col-11">
        
        <p-table [value]="ventas" 
                 [paginator]="true" 
                 [rows]="5" 
                 [rowsPerPageOptions]="[5, 10, 20]"
                 paginatorPosition="bottom"
                 currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} ventas"
                 showGridlines
                 [responsive]="true"
                 class="texto">          <ng-template pTemplate="header">
            <tr>
              <th>Fecha</th>
              <th>Total</th>
              <th>Forma de Pago</th>
              <th>Usuario</th>
              <th>Acciones</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-venta>
            <tr>
              <td>
                <!-- Usando el pipe date con un valor string ISO para formatear como fecha -->
                {{venta.fechaVenta ? (venta.fechaVenta | date:'medium') : 'Sin fecha'}}
              </td>
              <td>{{venta.total | currency}}</td>
              <td>{{venta.formaPago}}</td>
              <td>{{venta.usuario}}</td>
              <td>
                <p-button icon="pi pi-eye" 
                          class="p-button-text p-button-rounded" 
                          (click)="verVenta(venta.id)"
                          pTooltip="Ver detalle"></p-button>
                <p-button icon="pi pi-trash" 
                          class="p-button-text p-button-rounded p-button-danger" 
                          (click)="eliminarVenta(venta.id)"
                          pTooltip="Eliminar venta"></p-button>
              </td>
            </tr>
          </ng-template>
        </p-table>
        
      </div>
    </div>

  </div>
</div>

<!-- Toast para mensajes -->
<p-toast></p-toast>

<!-- Diálogo de confirmación -->
<p-confirmDialog></p-confirmDialog>

<app-footer></app-footer>
