<app-header [nombreUsuario]="'flp123'"></app-header>
<main>
  <article class="flex">
    <div class="w-full Tarjetas">
      <div class="tarjeta-1">
        <h1 class="titulo">{{ nombre }}</h1>
        <p>Telefono: {{ telefono }}</p>
        <p>Email: {{ email }}</p>
      </div>

      <div class="papaBoton">
        <p-button label="Editar" severity="secondary"></p-button>
      </div>

    </div>

    <img class="imagen">


  </article>

  <article class="w-full tablaMargen">
    <h1 class="tituloTabla">Productos</h1>
    <p-table class="tabla" [value]="productos" [tableStyle]="{ 'min-width': '20rem' }">
      <ng-template #header>
        <tr>
          <th>Id</th>
          <th>Codigo de Barras</th>
          <th>Nombre</th>
          <th>Stock</th>
        </tr>
      </ng-template>
      <ng-template #body let-producto>
        <tr>
          <td>{{ producto.id }}</td>
          <td>{{ producto.codigoBarras }}</td>
          <td>{{ producto.nombre }}</td>
          <td>{{ producto.stock }}</td>
        </tr>
      </ng-template>
    </p-table>
  </article>

  <article class="paginador w-full flex">
    <!-- Contenido de la paginación -->
    <p class="margenPaginador">{{ currentRange }} de {{ totalRecords }}</p>
    <p-button icon="pi pi-angle-left" (click)="prevPage()" [disabled]="currentPage === 1" severity="secondary"></p-button>
    <p-button icon="pi pi-angle-right" (click)="nextPage()" [disabled]="currentPage === totalPages" severity="secondary"></p-button>
  </article>


</main>
<app-footer></app-footer>
