<div class="grid">

  <!-- Lista de productos -->
  <div class="col-12 lg:col-8 lg:order-0 order-1 my-5 p-2 md:p-4 lg:p-5">
    <p-table
      class="texto"
      [value]="listaProductos"
      [paginator]="true"
      [rows]="5"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} productos"
      showGridlines [responsive]="true">
      <ng-template pTemplate="header">
        <tr>
          <th class="texto">Nombre</th>
          <th class="texto">Código</th>
          <th class="texto">Precio</th>
          <th class="w-10rem sm:w-8rem texto">Cantidad</th>
          <th class="w-6rem sm:w-4rem texto">Quitar</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-producto>
        <tr>
          <td>{{ producto.nombre }}</td>
          <td>{{ producto.codigoBarras }}</td>
          <td>{{ producto.precio | currency }}</td>
          <td>
            <p-inputNumber
              [(ngModel)]="producto.cantidad"
              [showButtons]="true"
              [min]="1"
              mode="decimal">
            </p-inputNumber>
          </td>
          <td>
            <button pButton icon="pi pi-trash" severity="contrast" (click)="eliminarProducto(producto)"></button>
          </td>
        </tr>
      </ng-template>

    </p-table>


  </div>

  <!-- Barra de búsqueda -->
  <div class="col-12 lg:col-4 lg:order-1 order-0 my-5 flex justify-content-center">
    <p-autoComplete
      class="texto"
      [(ngModel)]="productoSeleccionado"
      [suggestions]="productosFiltrados"
      (completeMethod)="filtrarProductos($event)"
      field="nombre"
      placeholder="Buscar producto..."
      [dropdown]="true"
      (onSelect)="agregarALista($event)">
    </p-autoComplete>

    <div class="fixed bottom-0 right-0 p-3 lg:pr-8 lg:pb-4 z-5">

      <div class="mb-3 p-3 border-round surface-card shadow-2">
    <span class="text-xl font-bold block text-right texto">
      Total: {{ calcularTotal() | currency }}
    </span>
      </div>

      <button pButton
              type="button"
              [raised]="true"
              severity = "contrast"
              label="Finalizar Venta"
              icon="pi pi-check"
              class="p-button-success texto"
              [disabled]="listaProductos.length === 0"
              (click)="finalizarVenta()"></button>
    </div>

  </div>

  <p-dialog
    header="Finalizar Venta"
    class="texto"
    [(visible)]="displayDialog"
    [style]="{width: '50vw', height: '35vw'}"
    [modal]="true"
    [closable]="false"
    [draggable]="false"
    [resizable]="false">

    <div class="grid p-fluid">
      <div class="col-12">
        <h5 class="texto">Cliente</h5>
        <p-dropdown
          class="texto"
          [(ngModel)]="clienteSeleccionado"
          [options]="clientes"
          optionLabel="nombre"
          placeholder="Seleccione un cliente"
          [showClear]="true">
        </p-dropdown>
      </div>

      <div class="col-12 mt-3">
        <h5 class="texto">Forma de Pago</h5>
        <p-dropdown
          [(ngModel)]="formaPagoSeleccionada"
          [options]="formasPago"
          class="texto"
          optionLabel="label"
          placeholder="Seleccione forma de pago"
          [required]="true">
        </p-dropdown>
      </div>

      <div class="col-12 mt-5 flex justify-content-end gap-2 fixed bottom-0 right-0">
        <button pButton
                type="button"
                label="Cancelar"
                icon="pi pi-times"
                variant="outlined"
                severity="danger"
                class="p-button-text texto"
                (click)="displayDialog = false"></button>
        <button pButton
                type="button"
                severity="contrast"
                label="Confirmar"
                icon="pi pi-check"
                class="p-button-success texto"
                (click)="confirmarVenta()"></button>
      </div>
    </div>
  </p-dialog>

</div>
