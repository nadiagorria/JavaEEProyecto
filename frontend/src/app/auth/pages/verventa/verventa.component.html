<div class="grid">

  <!-- Lista de productos (solo lectura) -->
  <div class="col-12 lg:col-8 lg:order-0 order-1 my-5 p-2 md:p-4 lg:p-5">
    <p-table
      class="texto"
      [value]="listaProductos"
      [paginator]="true"
      [rows]="5"
      [totalRecords]="totalRecords"
      [rowsPerPageOptions]="[5, 10, 20]"
      paginatorPosition="bottom"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} productos"
      showGridlines [responsive]="true">
      <ng-template pTemplate="header">
        <tr>
          <th class="texto">Nombre</th>
          <th class="texto">Código</th>
          <th class="texto">Precio</th>
          <th class="texto">Cantidad</th>
          <th class="texto">Subtotal</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-producto>
        <tr>
          <td class="texto">{{ producto.nombre }}</td>
          <td class="texto">{{ producto.codigoBarras }}</td>
          <td class="texto">{{ producto.precio | currency }}</td>
          <td class="texto">{{ producto.cantidad }}</td>
          <td class="texto">{{ (producto.precio * producto.cantidad) | currency }}</td>
        </tr>
      </ng-template>
      <ng-template pTemplate="footer" *ngIf="listaProductos.length > 0">
        <tr>
          <td colspan="3" class="text-right font-bold">Total:</td>
          <td class="texto font-bold">{{ getTotalCantidad() }}</td>
          <td class="texto font-bold">{{ getTotalVenta() | currency }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
