
  <div class="center-wrapper">
    <div class="login-container">
      <h2 class="titulo">Iniciar Sesión</h2>

        <form [formGroup]="formGroup" (ngSubmit)="onSubmit()">

          <p-iftalabel class="form-field">
            <input pInputText id="username" formControlName="username" />
            <label class="texto" for="username">Nombre de Usuario</label>
          </p-iftalabel>

          <p-iftalabel class="form-field">
            <p-password formControlName="password" inputId="password" [toggleMask]="true" [feedback]="false"/>
            <label class="texto" for="password">Contraseña</label>
          </p-iftalabel>

          <button pButton type="submit" label="Iniciar Sesión" class="texto" severity="contrast" [raised]="true" [disabled]="formGroup.invalid"></button>
        </form>
      <div class="registro"> ¿No tienes una cuenta?
        <a routerLink="/registro">Crear cuenta aquí</a>
      </div>

    </div>
  </div>
